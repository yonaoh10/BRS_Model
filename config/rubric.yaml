# Scoring rubric: 8 dimensions, weighted total on a 0-100 scale.
# gate: true  -> a score <= 2 on this dimension caps the total at 59 (gate_failed).
# signal: llm      -> scored by the LLM judge from the transcript alone.
#         hybrid   -> the judge sees the listed objective features and must
#                     ground its score in them.
# Anchors are behavioral and observable, in Hebrew (user-facing text).
version: "1.0.0"
dimensions:
  - id: identification
    name_he: "זיהוי ואימות לקוח"
    weight: 0.15
    scale: "1-5"
    gate: true
    signal: llm
    anchors:
      "1": "הבנקאי לא ביצע זיהוי כלל, או מסר מידע על החשבון לפני שהשלים אימות של פרט מזהה כלשהו."
      "3": "הבנקאי ביקש פרט מזהה אחד בלבד (למשל תעודת זהות) והמשיך בשיחה, ללא שאלת אימות נוספת כנדרש בנוהל."
      "5": "הבנקאי ביצע זיהוי מלא בתחילת השיחה: ביקש לפחות שני פרטים מזהים, המתין לתשובה מלאה, ואישר במפורש שהזיהוי הושלם לפני מסירת מידע."
  - id: compliance
    name_he: "ציות וגילוי נאות"
    weight: 0.15
    scale: "1-5"
    gate: true
    signal: llm
    anchors:
      "1": "הבנקאי מסר מידע מטעה, הבטיח תשואה או תוצאה, או דילג על חובת גילוי מהותית (עמלות, ריבית, סיכון) כשנדרשה."
      "3": "הבנקאי מסר את המידע המהותי אך באופן חלקי: הזכיר עמלה או תנאי בלי לפרט סכומים או השלכות, או גילה רק לאחר שהלקוח שאל."
      "5": "הבנקאי מסר גילוי נאות מלא ויזום: פירט עמלות, תנאים וסיכונים רלוונטיים בשפה ברורה, בלי הבטחות ובלי מידע מטעה, לפני שהלקוח נדרש לשאול."
  - id: empathy
    name_he: "אמפתיה ושותפות"
    weight: 0.15
    scale: "1-5"
    gate: false
    signal: llm
    anchors:
      "1": "הבנקאי התעלם מאמירות רגשיות או ממצוקה של הלקוח, קטע אותו, או השיב בנוסח טכני בלבד לאורך כל השיחה."
      "3": "הבנקאי הגיב לדברי הלקוח באדיבות בסיסית (\"אני מבין\") אך לא שיקף את הקושי הספציפי ולא התאים את הטון למצב הלקוח."
      "5": "הבנקאי שיקף במילים את מצבו של הלקוח (\"אני שומע שזה מלחיץ אותך\"), הכיר בקושי הספציפי, והציע ליווי אקטיבי לאורך הטיפול."
  - id: listening
    name_he: "הקשבה פעילה"
    weight: 0.10
    scale: "1-5"
    gate: false
    signal: hybrid
    features: [talk_ratio, interruptions_by_banker, patience_median_sec]
    anchors:
      "1": "הבנקאי דיבר רוב הזמן (יחס דיבור גבוה מאוד), קטע את הלקוח שוב ושוב, וענה לפני שהלקוח סיים לתאר את הצורך."
      "3": "הבנקאי הקשיב באופן בסיסי אך קטע את הלקוח לעיתים, או שיחס הדיבור נטה בבירור לצד הבנקאי; שאלות המשך בודדות בלבד."
      "5": "הבנקאי נתן ללקוח לסיים, המתין לפני שענה, שאל שאלות המשך שמראות שהבין, וסיכם במילותיו את מה שהלקוח ביקש."
  - id: clarity
    name_he: "מתן מידע ובהירות"
    weight: 0.15
    scale: "1-5"
    gate: false
    signal: llm
    anchors:
      "1": "ההסברים היו שגויים, סותרים או עמוסים במונחים מקצועיים ללא פישוט; הלקוח נדרש לשאול שוב ושוב ולא קיבל תשובה ברורה."
      "3": "המידע שנמסר היה נכון אך חלקי או מסורבל: הלקוח נזקק לשאלות הבהרה, והבנקאי לא וידא שהלקוח הבין."
      "5": "הבנקאי מסר מידע מדויק, מובנה ופשוט: פירק תהליך לשלבים, נקב בסכומים ובמועדים מדויקים, ווידא הבנה (\"האם זה ברור?\")."
  - id: resolution
    name_he: "פתרון הפנייה"
    weight: 0.15
    scale: "1-5"
    gate: false
    signal: llm
    anchors:
      "1": "הפנייה לא טופלה: הבנקאי הפנה את הלקוח הלאה ללא טיפול, סיים את השיחה בלי פתרון ובלי מסלול המשך מוגדר."
      "3": "הפנייה טופלה חלקית: ניתן מענה לחלק מהבקשה, או שנפתחה פנייה להמשך טיפול ללא מועד ומסלול ברורים."
      "5": "הפנייה נפתרה במלואה בשיחה עצמה, או שנקבע מסלול טיפול מלא: מי מטפל, מה השלבים, ועד מתי הלקוח יקבל מענה."
  - id: suitability
    name_he: "התאמת המענה לצורך"
    weight: 0.10
    scale: "1-5"
    gate: false
    signal: llm
    anchors:
      "1": "המענה או המוצר שהוצע אינו קשור לצורך שהלקוח תיאר, או שהוצע מוצר בלי לברר את מצב הלקוח וצרכיו כלל."
      "3": "המענה רלוונטי באופן כללי, אך הבנקאי לא בירר פרטים מספיקים (סכום, מטרה, טווח) כדי להתאים אותו למצב הספציפי."
      "5": "הבנקאי בירר את הצורך בשאלות ממוקדות, והציע מענה שמתייחס במפורש לנתונים שהלקוח מסר, כולל הסבר מדוע המענה מתאים דווקא לו."
  - id: closure
    name_he: "סגירה והצעד הבא"
    weight: 0.05
    scale: "1-5"
    gate: false
    signal: llm
    anchors:
      "1": "השיחה הסתיימה באופן פתאומי: ללא סיכום, ללא הגדרת צעד הבא וללא בדיקה אם יש ללקוח שאלות נוספות."
      "3": "הבנקאי סיכם בקצרה או נפרד יפה, אך לא חזר על הצעד הבא ועל מועדים, או לא שאל אם נותרו שאלות."
      "5": "הבנקאי סיכם את השיחה: חזר על מה שסוכם ועל הצעד הבא כולל מועד, שאל אם יש שאלות נוספות, ונפרד באדיבות."
