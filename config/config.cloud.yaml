# DEV-PHASE CLOUD OVERLAY - delete this file when moving to the bank servers.
#
# Same pipeline as config/config.yaml, except the two heavy stages are served
# by a rented GPU machine instead of running locally. Everything else
# (ingestion, VAD, speaker attribution, redaction, features, reports) still
# runs on your own computer.
#
#   python cloud/runpod_cli.py up          # start the GPU box, print keys
#   python -m callqa run --config config/config.cloud.yaml
#   python cloud/runpod_cli.py down        # STOP billing
#
# Secrets: leave api_key empty here and export the env vars that
# `runpod_cli.py urls` prints, so no key is ever committed to git.
paths:
  input_dir: data/input
  output_dir: data/output
  models_dir: models
  state_db: data/callqa_state.db

run:
  mock: false
  force: false
  max_workers: 1

audio:
  target_sample_rate: 16000
  vad: energy            # CPU-only VAD: no torch needed on your laptop
  min_speech_ms: 250

asr:
  engine: remote         # <-- the only pipeline change vs. the bank config
  base_url: ""           # set via CALLQA_ASR__BASE_URL
  api_key: null          # set via CALLQA_ASR__API_KEY
  language: he
  word_timestamps: true
  vad_filter: true
  timeout_sec: 900

speakers:
  mode: auto
  banker_channel: from_metadata

redaction:
  enabled: true
  ner: false

judge:
  engine: vllm           # unchanged: the bank config also uses vllm
  base_url: ""           # set via CALLQA_JUDGE__BASE_URL
  api_key: null          # set via CALLQA_JUDGE__API_KEY
  model: "dicta-il/dictalm2.0-instruct"
  temperature: 0.0
  max_tokens: 2500
  n_samples: 1
  max_retries: 3

reporting:
  group_comparison: median
  language: he
