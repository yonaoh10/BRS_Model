[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callqa"
version = "0.1.0"
description = "Hebrew Call-QA PoC - conversation intelligence pipeline for banker calls"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.scripts]
callqa = "callqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
