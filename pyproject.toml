[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callqa"
version = "1.2.0"
description = "Hebrew Call-QA PoC - conversation intelligence pipeline for banker calls"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Only scripts/download_models.py needs this, and only on a machine with
# network access. The runtime pipeline never downloads anything.
download = ["huggingface_hub>=0.25"]

[project.scripts]
callqa = "callqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The report templates AND the config yamls are code, not documentation:
# without them an installed (non-editable) wheel fails every call - templates
# with TemplateNotFound, the yamls with "could not find rubric.yaml". Both only
# ever showed up on the target machine because `pip install -e .` finds them on
# disk regardless. config_defaults/ ships the shipped defaults; find_config
# still prefers a repo-root or CALLQA_CONFIG_DIR copy so the bank can edit them.
[tool.setuptools.package-data]
callqa = ["reporting/templates/*.j2", "reporting/*.yaml", "config_defaults/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
