name: CI

# Runs in the DEVELOPMENT environment to validate a release before it is handed
# to the bank. The bank never runs CI.
#
# Every step here runs with the CORE dependencies alone - no GPU, no models, no
# network - which is the point: the whole pipeline is exercised end to end by a
# runner that has none of those things.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Both versions the project claims to support, and neither is allowed to
      # hide the other's failure.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The PINNED set from requirements.txt - the exact versions the offline
      # bundle carries to the bank - and the package with --no-deps, so
      # pyproject's loose floors cannot pull in anything newer. CI used to
      # install `-e .` alone, which resolved those floors against whatever PyPI
      # had that day: it validated a dependency set nobody would ever deploy.
      - name: Install (the pinned set the bank installs)
        run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests scripts dashboard
      - name: Tests
        run: python -m pytest -q
      # `if: always()` on the steps below because a test failure used to skip
      # them: the evaluation gate - the whole point of the MLOps layer - had
      # therefore never once executed in CI. A red suite must not be able to
      # hide a second, different regression behind it.
      - name: Mock end-to-end
        if: always()
        run: make mock-e2e
      - name: Evaluation gate (no regression vs baseline)
        if: always()
        run: python -m callqa eval --mock --baseline eval/baseline.json
      # The management report is made for batches of ~1,000 calls; the six
      # demo calls do not exercise it. A realistic synthetic batch does, and a
      # real browser proves its script runs and draws the explorer.
      - name: Management report over 1,000 synthetic calls
        if: always()
        run: |
          set -eux
          python scripts/generate_batch_demo.py --calls 1000 --workspace "$RUNNER_TEMP/batch"
          report="$RUNNER_TEMP/batch/output/reports/executive.html"
          python .github/check_executive_report.py "$report" --calls 1000
          # The installed Chrome, driven by Playwright (nothing downloaded).
          pip install playwright==1.55.0
          python .github/check_executive_browser.py "$report" --channel chrome
      # The journey report (repeat contacts) over 100 synthetic stories: the
      # vendor-format workbook, NICE recordings split across several files,
      # and the Atlas exports - imported, reported, and opened in Chrome.
      - name: Journey report over 100 synthetic stories
        if: always()
        run: |
          set -eux
          python scripts/generate_journey_demo.py --stories 100 --audio --workspace "$RUNNER_TEMP/journey"
          python .github/check_journey_report.py "$RUNNER_TEMP/journey/output/reports/journey.html" --stories 100 --channel chrome
          # the mock's reading against the demo's known truth: no regression
          CALLQA_PATHS__OUTPUT_DIR="$RUNNER_TEMP/journey/output" python -m callqa journey eval --labels "$RUNNER_TEMP/journey/input/truth_labels.csv" --baseline eval/journey_baseline.json
      - name: Deployability of a bare archive
        if: always()
        # What a reviewer downloads from GitHub is `git archive`, not the
        # working tree: git-ignored paths and empty directories are simply not
        # there. This proves the thing they actually receive runs.
        run: |
          set -eux
          git archive --format=tar --prefix=extract/ HEAD | tar -x -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/extract"
          # Exactly the README's steps: the installer builds .venv, and every
          # command after it runs with that interpreter.
          python scripts/install.py
          # The suite too, not just the pipeline: the deployment instructions
          # tell the engineer to run pytest from the extract, and a test that
          # shells out to git fails to COLLECT there while passing here.
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/first_run.py --no-dashboard
          test -s data/demo/output/reports/index.html
          test -s data/demo/output/reports/executive.html
          test ! -e data/input      # the demo never touches the real folders
          .venv/bin/python scripts/generate_sample_data.py
          .venv/bin/python -m callqa run --mock
          .venv/bin/python -m callqa report --mock
          .venv/bin/python -m callqa preflight --mock
          test -s data/output/reports/index.html

  # The hand-off documentation states that `rm -rf dashboard/` is supported.
  # It was only half true: the pipeline ran, but `make lint` failed on a path
  # that no longer existed and `pytest` could not even COLLECT the dashboard's
  # own tests - so a bank that took the documentation at its word and then ran
  # the verifying steps the documentation gives them saw a broken suite. A
  # claim nobody exercises is a claim that quietly stops being true.
  deletable-addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (the pinned set the bank installs)
        run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: Delete the optional dashboard
        run: rm -rf dashboard/
      - name: Lint, test and run the pipeline without it
        run: |
          set -eux
          make lint
          python -m pytest -q
          python scripts/generate_sample_data.py
          python -m callqa run --mock
          python -m callqa report --mock
          test -s data/output/reports/index.html
          test -s data/output/reports/executive.html

  # The bank's desktops are Microsoft VDI: Windows, no admin rights, no WSL
  # guaranteed. Everything the README tells a Windows user to type is typed
  # here, on a real Windows machine, in a folder whose path has a space and
  # Hebrew in it - the two things that break naive path handling.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (the pinned set the bank installs)
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests scripts dashboard
      - name: Tests
        run: python -m pytest -q
      - name: Mock end-to-end
        if: always()
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          python scripts/generate_sample_data.py
          python -m callqa run --mock
          python -m callqa calibrate --mock
          python -m callqa report --mock
      - name: Evaluation gate (no regression vs baseline)
        if: always()
        run: python -m callqa eval --mock --baseline eval/baseline.json
      # The management report in the bank's own browser: 1,000 realistic
      # synthetic calls, opened from disk by the Edge installed on the runner
      # and driven by Playwright - script errors, the explorer, a finding's
      # filter link, a drill-down and printing are all exercised.
      - name: Management report over 1,000 synthetic calls, opened in Edge
        if: always()
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $ws = Join-Path $env:RUNNER_TEMP "batch"
          python scripts/generate_batch_demo.py --calls 1000 --workspace $ws
          $report = Join-Path $ws "output\reports\executive.html"
          python .github/check_executive_report.py $report --calls 1000
          python -m pip install playwright==1.55.0
          python .github/check_executive_browser.py $report --channel msedge --screenshot (Join-Path $env:RUNNER_TEMP "executive-edge.png")
      - name: Journey report over 100 synthetic stories, opened in Edge
        if: always()
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $ws = Join-Path $env:RUNNER_TEMP "journey"
          python scripts/generate_journey_demo.py --stories 100 --audio --workspace $ws
          python .github/check_journey_report.py (Join-Path $ws "output\reports\journey.html") --stories 100 --channel msedge --screenshot (Join-Path $env:RUNNER_TEMP "journey-edge.png")
          $env:CALLQA_PATHS__OUTPUT_DIR = Join-Path $ws "output"
          python -m callqa journey eval --labels (Join-Path $ws "input\truth_labels.csv") --baseline eval/journey_baseline.json
      - name: Keep the management report and how Edge drew it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-report-windows-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/executive-edge.png
            ${{ runner.temp }}/batch/output/reports/executive.html
            ${{ runner.temp }}/journey-edge.png
            ${{ runner.temp }}/journey/output/reports/journey.html
          if-no-files-found: warn
      - name: The README's Windows steps, from a GitHub ZIP, in a path with a space and Hebrew
        if: always()
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          # GitHub's "Download ZIP" is `git archive` with LF endings.
          git -c core.autocrlf=false archive --format=zip --prefix=BRS_Model-main/ -o "$env:RUNNER_TEMP\repo.zip" HEAD
          $dest = Join-Path $env:RUNNER_TEMP "בדיקה עם רווח"
          Expand-Archive -Path "$env:RUNNER_TEMP\repo.zip" -DestinationPath $dest
          Set-Location (Join-Path $dest "BRS_Model-main")
          # The offline path: a bundle built on a Windows machine with internet,
          # then an install that must not touch the network (--no-index).
          python scripts/build_offline_bundle.py --core-only
          python scripts/install.py
          .\.venv\Scripts\python -m pytest -q
          .\.venv\Scripts\python scripts\first_run.py --no-dashboard
          if (-not (Test-Path data\demo\output\reports\index.html)) { throw "no demo index.html" }
          if (-not (Test-Path data\demo\output\reports\executive.html)) { throw "no demo management report" }
          if (Test-Path data\input) { throw "the demo wrote into data\input" }
          .\.venv\Scripts\python scripts\generate_sample_data.py
          .\.venv\Scripts\python -m callqa run --mock
          .\.venv\Scripts\python -m callqa report --mock
          .\.venv\Scripts\python -m callqa preflight --mock
          if (-not (Test-Path data\output\reports\index.html)) { throw "no index.html" }
          .\.venv\Scripts\python -m callqa executive-report --mock --from 2026-08-01 --to 2026-08-31 --no-quotes
          if (-not (Test-Path data\output\reports\executive-2026-08-01_2026-08-31.html)) { throw "no scoped management report" }
          # A Scheduled Task writes stdout to a file, in the ANSI code page.
          .\.venv\Scripts\python -m callqa run --mock --force *> run.log
          if ($LASTEXITCODE -ne 0) { Get-Content run.log; throw "run with redirected output failed" }
