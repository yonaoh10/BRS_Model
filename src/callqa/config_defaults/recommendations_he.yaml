# Coaching recommendations per rubric dimension (Hebrew, user-facing).
# 2-3 concrete, behavioral, action-phrased recommendations per dimension.
# Reports pick one recommendation for the weakest (non-gate-failed) dimension.
identification:
  - "פתח כל שיחה בבקשת שני פרטים מזהים לפחות (תעודת זהות + פרט נוסף), ואמור במפורש \"הזיהוי הושלם\" לפני שאתה מוסר מידע על החשבון."
  - "אם הלקוח מתחיל לתאר את הבקשה לפני הזיהוי, עצור בעדינות: \"רק רגע, כדי שאוכל לעזור אני חייב קודם לזהות אותך\"."
compliance:
  - "לפני הצגת מוצר או פעולה, עבור על שלושה פריטים בקול: עמלה, ריבית/תנאי, וסיכון או מגבלה - גם אם הלקוח לא שאל."
  - "החלף ניסוחים מבטיחים (\"זה בטוח משתלם\") בניסוח עובדתי: \"התנאים נכון להיום הם X, והם עשויים להשתנות\"."
empathy:
  - "כשהלקוח מבטא קושי או לחץ, שקף אותו במשפט אחד לפני שאתה עובר לפתרון: \"אני שומע שזה מטריד אותך, בוא נסדר את זה יחד\"."
  - "השתמש בשם הפנייה שהלקוח בחר ופנה אליו אישית לפחות פעם אחת בפתיחה ופעם אחת בסיום."
  - "אחרי מסירת בשורה לא נעימה (סירוב, עמלה), הוסף משפט הכרה בקושי לפני המעבר לחלופות."
listening:
  - "המתן 2-3 שניות אחרי שהלקוח מסיים לדבר לפני שאתה עונה - גם אם נדמה לך שהבנת את הבקשה באמצע."
  - "סכם במילים שלך את בקשת הלקוח לפני שאתה מציע פתרון: \"אם הבנתי נכון, אתה מבקש...\"."
  - "שאל לפחות שתי שאלות המשך פתוחות (\"ספר לי עוד על...\") לפני שאתה עובר להצעת מענה."
clarity:
  - "פרק כל תהליך לשלבים ממוספרים: \"קודם נעשה X, אחר כך Y, ובסוף Z\" - ונקוב בסכומים ובמועדים מדויקים."
  - "אחרי כל הסבר מהותי, ודא הבנה בשאלה ישירה: \"האם זה ברור? רוצה שאחזור על משהו?\"."
  - "החלף מונחים מקצועיים במילים יומיומיות, או הוסף הסבר קצר מיד אחרי המונח."
resolution:
  - "לפני סיום השיחה, ודא שאחת משתיים התקיימה: הבקשה טופלה בשיחה, או שהוגדר בקול מי מטפל ועד מתי הלקוח יקבל תשובה."
  - "אם אינך יכול לפתור בעצמך, אל תסתפק בהפניה - פתח את הפנייה עבור הלקוח בזמן השיחה ומסור לו מספר פנייה."
suitability:
  - "לפני שאתה מציע מוצר או מסלול, שאל לפחות שלוש שאלות בירור: מטרה, סכום, וטווח זמן."
  - "נמק כל הצעה בנתון שהלקוח מסר: \"בגלל שאמרת ש..., המסלול שמתאים לך הוא...\"."
closure:
  - "סיים כל שיחה בסיכום של שלושה משפטים: מה סוכם, מה הצעד הבא ומתי, ושאלה אם נותרו שאלות נוספות."
  - "חזור על כל מועד או התחייבות פעם נוספת בסיום השיחה, כדי שהלקוח יֵצא עם תאריך ברור."
