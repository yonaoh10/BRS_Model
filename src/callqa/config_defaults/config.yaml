# Main configuration for the Call-QA pipeline.
# Every field can be overridden with environment variables prefixed CALLQA_,
# nested keys separated by double underscores, e.g. CALLQA_JUDGE__BASE_URL=...
paths:
  input_dir: data/input
  output_dir: data/output
  models_dir: models
  state_db: data/callqa_state.db

run:
  mock: false
  force: false
  max_workers: 1          # applies to the `run` driver only

watch:
  poll_seconds: 30
  stable_seconds: 10
  move_processed: true

audio:
  target_sample_rate: 16000
  vad: silero             # silero | energy (energy = dependency-free fallback, used in mock)
  min_speech_ms: 250

asr:
  engine: faster_whisper  # faster_whisper | mock
  # Paths: forward slashes work on Windows too. A Windows path with backslashes
  # must stay in SINGLE quotes - inside double quotes a backslash is an escape.
  model_dir: '{models_dir}/ivrit-whisper-large-v3-turbo-ct2'  # PLACEHOLDER - populated by scripts/download_models.py
  language: he            # MUST be forced; never autodetect
  compute_type: float16   # GPU; on a machine without a usable GPU int8 is used automatically
  device: auto            # auto | cpu | cuda
  word_timestamps: true
  vad_filter: true

speakers:
  mode: auto              # auto: stereo -> channel split; single channel -> diarization
  banker_channel: from_metadata   # L | R | from_metadata
  # Accept the conditions once on huggingface.co and set HF_TOKEN to fetch it;
  # afterwards it runs offline. A filesystem path here loads a local pipeline.
  diarization_model: 'pyannote/speaker-diarization-community-1'   # or a local folder, in single quotes
  num_speakers: 2         # a banker call has exactly two parties; 0 = estimate
  device: auto            # auto | cpu | cuda
  exclusive: true         # one speaker per moment, for word-level alignment
  min_role_confidence: 0.34   # below this the call is held for human review

redaction:
  enabled: true
  ner: false              # true requires DictaBERT-NER download (optional)

judge:
  engine: vllm            # vllm | mock
  # 127.0.0.1, not "localhost": on Windows localhost resolves to [::1] first,
  # and the local judge server listens on 127.0.0.1 only.
  base_url: "http://127.0.0.1:8000/v1"
  model: "<LLM_MODEL_ID_PLACEHOLDER>"   # decided on server per available VRAM; see scripts/download_models.py
  temperature: 0.0
  max_tokens: 2500
  n_samples: 1            # optional self-consistency: 3 -> median per dimension
  max_retries: 3

reporting:
  group_comparison: median
  language: he

# How long RAW, PII-bearing artifacts live before `callqa retention --apply`
# destroys them: raw transcripts, raw audio, and the original recordings the
# `watch` driver moved into input/processed/ and input/failed/. Redacted
# transcripts, redacted audio, scores and reports are never touched. Set this
# to the bank's policy; `callqa retention` (no flag) lists what would go.
retention:
  raw_days: 90

monitoring:
  # Machine cost per GPU-hour, for the cost line in each run manifest.
  # 0 = report GPU-hours only, no currency figure.
  gpu_cost_per_hour: 0.0

# Customer journeys and repeat contacts (`callqa journey ...`;
# docs/journey_report_he.md). Every value here has a default; this section
# only shows the ones worth knowing.
journey:
  callback_business_days: 2   # a promise is kept if the bank acts within this many Sun-Thu days
  quiet_days: 7               # no contact this long after the bank acted = the story closed
  min_rate_n: 10              # rates are shown only on at least this many cases
  min_firm_n: 30              # below this a figure is marked preliminary
  redact_messages: true       # message bodies go through the redactor at import
  llm:
    # cpu = a small model on this machine (8K context, one at a time, calls
    # shortened around cue phrases); gpu = the bank's internal GPU server
    # (32K, six at once, whole calls). The endpoint and model default to the
    # judge's above; set gpu_base_url for the GPU server.
    profile: cpu
    engine: inherit            # inherit | vllm | mock
    # gpu_base_url: "https://llm.internal.example/v1"
    # model: "..."
